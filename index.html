  // 考研英语（英译中真题）
  { id: 'k1', chinese: '那些不仅能够坦然面对失败、从中提炼出有价值的教训，而且能够将这种由失败所催生的反思转化为持续行动的动力、而非让挫败感蚕食自己信心的人，最终往往能够在那些起初看来遥不可及的领域取得令人瞩目的成就——这一规律已经被古往今来无数杰出人物的生命轨迹反复印证，其背后所蕴含的关于人类韧性与成长的深刻洞见，值得我们每一个人深思。', english: 'Those who are able not only to face failure with equanimity and extract valuable lessons from it, but also to transform the reflection catalyzed by such failure into a sustained impetus for action rather than allowing the sense of defeat to erode their confidence, tend ultimately to achieve remarkable accomplishments in domains that initially appeared far beyond their reach — a pattern that has been repeatedly corroborated by the life trajectories of countless distinguished figures throughout history, and whose profound insights into human resilience and growth merit deep reflection from every one of us.', category: 'kaoyan' },
  { id: 'k2', chinese: '尽管大多数国家的决策者已经在公开场合反复强调环境保护的极端重要性，并在过去几十年间陆续出台了一系列看似严密的环保法律法规，然而一旦这些精心设计的制度安排触及到那些与经济增长直接挂钩的核心利益——无论是传统能源行业的巨额税收贡献、还是可能因环保标准提高而面临生存危机的中小制造企业——执法力度便往往在来自各方的游说压力之下大打折扣，这种环境保护与经济发展之间的深刻张力，恰恰揭示了现代治理中最为棘手的困境之一。', english: 'Although policymakers in most countries have repeatedly emphasized the paramount importance of environmental protection in public forums and have, over the past few decades, successively introduced a series of seemingly rigorous environmental laws and regulations, the moment these carefully designed institutional arrangements begin to impinge upon core interests directly tied to economic growth — whether it be the enormous tax contributions of traditional energy industries or the small and medium-sized manufacturing enterprises that face existential threats due to higher environmental standards — the intensity of enforcement often diminishes considerably under lobbying pressure from all sides, and this profound tension between environmental protection and economic development precisely reveals one of the most intractable dilemmas in modern governance.', category: 'kaoyan' },
  { id: 'k3', chinese: '如果说科学在过往数个世纪所取得的每一次重大突破——从哥白尼将地球从宇宙中心移开所引发的世界观革命、到达尔文通过自然选择理论彻底重塑人类对生命起源的认知、再到爱因斯坦的相对论将时空本身变成一个可以被弯曲和拉伸的动态实体——都无一例外地依赖于一种敢于质疑一切既定权威、勇于在看似荒谬的假设基础上构建全新理论框架的精神，那么我们有充分的理由相信，未来那些我们现在尚无法想象的科学革命，同样将孕育于那些能够抵御学术共同体内部因循守旧压力、坚持不懈地追问那些被视为"理所当然"的基本前提的少数特立独行之士的头脑之中。', english: 'If every major breakthrough that science has achieved over the past centuries — from the Copernican revolution that displaced the Earth from the center of the universe and triggered a wholesale transformation of the human worldview, to Darwin\'s radical reshaping of our understanding of the origin of life through the theory of natural selection, to Einstein\'s theory of relativity that turned space and time themselves into a dynamic entity capable of being bent and stretched — has without exception depended upon a spirit that dares to question all established authorities and to construct entirely new theoretical frameworks on the basis of assumptions that initially appear absurd, then we have every reason to believe that the scientific revolutions of the future, which we cannot yet even imagine, will likewise be nurtured in the minds of those rare nonconformists who can withstand the conformist pressures within the academic community and persistently interrogate the fundamental premises that are taken for granted by everyone else.', category: 'kaoyan' },
  { id: 'k4', chinese: '在一个被信息洪流所淹没的时代里，当任何一个拥有智能手机的人每天所接收到的数据量都超过了中世纪一个学者一生所能接触到的全部信息的总和，当算法推荐系统在不知疲倦地为我们量身定制一个越来越窄、越来越舒适的信息茧房，当深度伪造技术已经发展到让普通人几乎无法凭借肉眼辨别一段视频究竟是真实记录还是精心合成的产物——在这样的时代背景下，批判性思维能力已经不再仅仅是学术界所推崇的一种锦上添花的认知美德，而是演变成了每一个不愿意被操纵、被欺骗、被异化为数据生产工具的公民所必须掌握的一种生存技能。', english: 'In an age engulfed by a deluge of information, when any individual with a smartphone receives more data in a single day than a medieval scholar could have encountered in an entire lifetime, when algorithmic recommendation systems tirelessly tailor for each of us an increasingly narrow and comfortable information cocoon, and when deepfake technology has advanced to the point where ordinary people can hardly distinguish with the naked eye whether a video clip is a genuine recording or a meticulously fabricated product — against such a backdrop, critical thinking skills are no longer merely an agreeable cognitive virtue extolled by academia, but have evolved into a survival skill that every citizen who wishes not to be manipulated, deceived, or reduced to a mere instrument of data production must necessarily possess.', category: 'kaoyan' },
  { id: 'k5', chinese: '人工智能技术正在以如此之快的速度渗透到人类生活的方方面面——从能够通过分析数百万份病历而在某些疾病的早期筛查中表现超越资深医生的医疗诊断系统，到可以在几秒钟内生成一篇结构严谨、论据充分的法律文书的大语言模型，再到已经开始在旧金山和深圳的公共道路上接送乘客的自动驾驶出租车队——以至于那些在五年前还被主流观点认为至少需要半个世纪才能实现的技术突破，如今已经变成了一个个需要各国政府在仓促之间制定监管框架来应对的紧迫政策议题，而这种技术演进与社会规制之间的速度差，正在成为我们这个时代最具挑战性的治理难题。', english: 'Artificial intelligence technology is penetrating every facet of human life at such a dizzying pace — from medical diagnostic systems that, by analyzing millions of patient records, can outperform seasoned physicians in the early screening of certain diseases, to large language models capable of generating a tightly structured, well-reasoned legal document within seconds, to the autonomous taxi fleets that have already begun ferrying passengers on the public roads of San Francisco and Shenzhen — that technological breakthroughs which mainstream opinion as recently as five years ago considered to be at least half a century away have now become urgent policy issues requiring governments to hastily cobble together regulatory frameworks to address them, and this velocity gap between technological evolution and social regulation is emerging as the most formidable governance challenge of our era.', category: 'kaoyan' },
  { id: 'k6', chinese: '历史学家在试图解释为什么某些文明——比如曾经建造了庞大水利工程并发展出精密文字系统的古埃及、以及创造了民主制度雏形并孕育了苏格拉底、柏拉图和亚里士多德三位哲学巨擘的古希腊——最终走向衰落而另一些文明却在经历了类似的危机之后焕发出新的生机时，越来越倾向于认为，决定一个文明命运的关键变量并不在于其所积累的物质财富的多寡或者军事征服能力的高低，而在于其制度和文化在面对重大冲击时是否具备足够的弹性来吸收震荡、整合异质元素、并在不丧失自身核心认同的前提下完成自我革新。', english: 'When historians attempt to explain why certain civilizations — such as ancient Egypt, which constructed enormous hydraulic projects and developed an elaborate writing system, and ancient Greece, which created the prototype of democracy and nurtured the three philosophical giants of Socrates, Plato, and Aristotle — ultimately declined while other civilizations managed to rejuvenate themselves after experiencing similar crises, they increasingly incline toward the view that the decisive variable determining the fate of a civilization lies not in the magnitude of the material wealth it has accumulated or the extent of its military prowess, but in whether its institutions and culture possess sufficient resilience, when confronted with major shocks, to absorb the tremors, integrate heterogeneous elements, and accomplish self-renewal without losing their core identity.', category: 'kaoyan' },
  { id: 'k7', chinese: '那些斩钉截铁地宣称全球化作为一种历史趋势已经不可逆转地走向终结的评论家们，似乎选择性地忽视了一个尽管不那么引人注目、但却具有根本性重要意义的事实——即便在保护主义情绪和地缘政治对抗日益加剧的表象之下，人类所共同面临的生存性挑战——从不会在任何国家的边境线上停下脚步的气候变化和生物多样性崩溃，到能够在几周之内通过国际航班网络传遍全球每一个角落的新型传染病，再到那些利用加密通信和暗网交易平台而使得任何单一国家的执法机构都束手无策的跨国犯罪网络——不仅在客观上没有减弱，反而正在以一种迫使最不情愿合作的政治力量也不得不坐到谈判桌前的紧迫性，持续强化着全球协作的必要性。', english: 'Those commentators who categorically assert that globalization as a historical trend has irreversibly run its course appear to selectively overlook a fact that, though less conspicuous, is of fundamentally significant importance — namely that even beneath the surface of rising protectionist sentiment and intensifying geopolitical confrontation, the existential challenges that humanity collectively faces — from climate change and biodiversity collapse, which stop at no national border, to novel infectious diseases capable of spreading to every corner of the globe through international flight networks within a matter of weeks, to transnational criminal networks that employ encrypted communications and darknet trading platforms to render the law enforcement agencies of any single country powerless — have not only failed to diminish objectively but are instead continuously reinforcing the necessity of global cooperation with an urgency that compels even the most recalcitrant political forces to take a seat at the negotiating table.', category: 'kaoyan' },
  { id: 'k8', chinese: '我们在长达二十年的时间里追踪了两千多名来自不同社会经济背景的儿童的成长轨迹之后所得出的数据强烈表明，那些在进入小学之前就已经通过家庭环境中的日常互动——包括但不限于父母与孩子之间在餐桌上的开放式对话、对图画书内容的自发讨论、以及照顾者对幼儿提出的看似天马行空的问题所给予的耐心而富有启发性的回应——积累了丰富的口头词汇和叙事经验的儿童，不仅在后续的学术生涯中始终保持着显著的成绩优势，而且这种因早期语言环境的差异而导致的认知发展差距，非但没有像一些乐观的教育学家所预言的那样随着学校教育的推进而自然弥合，反而在进入中学之后呈现出进一步扩大的趋势，这一发现对于公共政策制定具有深远的意义。', english: 'The data we have obtained after tracking the developmental trajectories of more than two thousand children from diverse socioeconomic backgrounds over a period of two decades strongly indicate that those children who, before entering primary school, had already accumulated an abundant repertoire of oral vocabulary and narrative experience through everyday interactions within the home environment — including but not limited to open-ended conversations between parents and children around the dinner table, spontaneous discussions about the contents of picture books, and the patient and enlightening responses that caregivers offered to the seemingly fanciful questions posed by toddlers — not only maintained a significant academic advantage throughout their subsequent educational careers, but that this cognitive development gap, caused by differences in early language environments, far from narrowing naturally with the progression of schooling as some optimistic educationalists had predicted, has actually shown a tendency to widen further after entry into secondary school, a finding that carries profound implications for public policymaking.', category: 'kaoyan' },
  { id: 'k9', chinese: '如果说一个人之所以能够在其所选择的领域内达到卓越的境界——无论这种卓越是体现为一位科学家在经历了数百次失败实验之后依然能够保持着初次走进实验室时的那种热忱与专注，还是体现为一位艺术家在商业化的浪潮席卷一切的时代里仍然坚守着自己那套不被市场看好的创作理念——其背后最为关键的驱动力并不是那种容易被时间消磨的外在激励因素（如金钱、名誉或他人的认可），而是一种深植于个体内心的、几乎接近于执念的内在驱动力，那么我们的教育体系——从基础教育到高等教育——最为紧迫的任务，或许并不在于如何更高效地向年轻一代传输日益膨胀的知识体系，而在于如何小心翼翼地保护并悉心培养每一个孩子与生俱来的那种对于未知世界的好奇心以及通过自身努力去理解并改变周围环境的强烈愿望。', english: 'If the most critical driving force behind a person\'s attainment of excellence in their chosen field — whether such excellence manifests as a scientist who, after hundreds of failed experiments, still retains the same passion and focus as when they first stepped into the laboratory, or as an artist who, in an era when the tide of commercialization sweeps away everything in its path, still adheres to a set of creative principles that the market does not favor — is not those extrinsic motivating factors (such as money, fame, or the recognition of others) that are easily eroded by the passage of time, but rather an internal driving force deeply rooted within the individual, one that borders on obsession, then the most urgent task of our educational systems — from basic education to higher education — may not lie in how to transmit the ever-expanding body of knowledge to the younger generation with greater efficiency, but in how to carefully protect and meticulously cultivate the innate curiosity about the unknown world that every child is born with, along with the strong desire to understand and transform their surrounding environment through their own efforts.', category: 'kaoyan' },
  { id: 'k10', chinese: '当我们在谈论"文化冲突"这一概念时，一个经常被忽略但却至关重要的细微差别在于：真正导致不同群体之间产生敌意与隔阂的，很少是那些浮在表层的文化符号差异——比如一个民族偏好米饭而另一个民族以面包为主食，或者一方习惯用握手来表达问候而另一方则选择鞠躬——而往往是那些更深层次的、关于是非对错的根本性价值判断上的分歧，例如个体权利与集体义务之间的优先次序应当如何安排、以及性别角色应当在多大程度上由生物差异而非社会共识来决定；然而，如果我们愿意放下那种急于对异质文化做出优劣高下之判的本能冲动，耐心地去追溯每一种价值体系之所以形成其独特面貌的历史脉络与生存逻辑，就不难发现，那些看似不可调和的观念对立背后，其实共享着许多共通的人性关怀。', english: 'When we speak of the concept of the "clash of civilizations," a crucial nuance that is frequently overlooked yet vitally important is this: what truly engenders hostility and estrangement between different groups is seldom those superficial differences in cultural symbols — such as one ethnic group preferring rice while another takes bread as its staple, or one side being accustomed to expressing greetings through handshakes while the other opts for bows — but rather those deeper divergences in fundamental value judgments concerning right and wrong, such as how the order of priority between individual rights and collective obligations ought to be arranged, and to what extent gender roles should be determined by biological differences rather than social consensus; however, if we are willing to set aside that instinctive impulse to rush to judgments of superiority or inferiority regarding cultures different from our own, and patiently trace the historical context and survival logic behind why each value system has assumed its unique contours, it is not difficult to discover that behind those seemingly irreconcilable conceptual oppositions there actually lie many shared concerns of a common humanity.', category: 'kaoyan' },
  { id: 'k11', chinese: '尽管社交媒体平台在设计之初所标榜的使命——"让世界更加开放和互联"、"赋予每一个人发声的权利"——听起来是如此的崇高而毋庸置疑，以至于在其发展的第一个十年里，几乎没有人敢于公开质疑这些平台是否真的在兑现其创始人们所描绘的美好愿景，然而随着一波又一波严谨的实证研究——从追踪青少年心理健康指标在智能手机普及前后的显著恶化趋势、到揭示算法推荐机制如何系统性地将温和的政治观点推向极化的一端、再到曝光某些平台在明知虚假信息正在造成现实世界伤害的情况下依然因其能够带来高额互动流量而选择袖手旁观——逐渐浮出水面，一个令人不安的真相正在变得越来越难以回避：这些曾经被视为民主化力量的技术工具，在某些关键方面恰恰正在削弱一个健康民主社会赖以运转的基础。', english: 'Although the missions that social media platforms proclaimed at their inception — "to make the world more open and connected," "to give everyone a voice" — sounded so noble and incontrovertible that during their first decade of development almost no one dared to publicly question whether these platforms were truly delivering on the beautiful vision their founders had depicted, as wave after wave of rigorous empirical research — from tracking the marked deterioration in adolescent mental health indicators before and after the popularization of smartphones, to revealing how algorithmic recommendation mechanisms systematically nudge moderate political views toward the polarized extreme, to exposing how certain platforms, fully aware that disinformation was causing real-world harm, nonetheless chose to stand by because such content generated high levels of interaction and traffic — has gradually surfaced, a disturbing truth is becoming increasingly difficult to evade: these technological tools, once regarded as democratizing forces, are in certain crucial respects precisely undermining the very foundations upon which a healthy democratic society depends for its functioning.', category: 'kaoyan' },
  { id: 'k12', chinese: '经济学家们围绕"不平等"这一议题所展开的旷日持久的争论——争论的焦点不仅在于收入差距和财富集中度是否已经达到了应当引起警惕的水平（尽管仅此一点已经足以在学术界内部产生深刻的分歧），更在于不平等本身究竟是一种需要被接纳和容忍的、激励创新与勤奋工作的自然市场结果，还是一种会通过代际传递而不断自我强化、最终侵蚀社会凝聚力和民主制度合法性的破坏性力量——在很大程度上取决于一个更为根本性的、却往往被淹没在技术性数据分析和计量模型之中的前提性问题：我们究竟应当如何定义和衡量一个社会的"进步"，是仅仅看人均GDP的增长曲线是否保持向上倾斜，还是应当将那些难以量化的维度——如公民对自己生活的掌控感、人与人之间信任的深度、以及每一个社会成员无论出身如何都能拥有公平机会去实现自身潜能的制度保障——纳入我们对"发展"这一概念的理解之中。', english: 'The protracted debate that economists have engaged in around the issue of "inequality" — a debate whose focus lies not only in whether the income gap and wealth concentration have already reached levels that should trigger alarm (though this point alone is sufficient to generate profound divisions within the academic community), but more fundamentally in whether inequality itself is a natural market outcome that incentivizes innovation and industriousness and therefore ought to be accepted and tolerated, or a destructive force that continually reinforces itself through intergenerational transmission and ultimately erodes social cohesion and the legitimacy of democratic institutions — depends to a large extent on a more fundamental question that is often drowned out amidst technical data analysis and econometric modeling: how exactly should we define and measure the "progress" of a society? Is it sufficient to look merely at whether the per capita GDP growth curve maintains an upward slope, or should we incorporate those dimensions that are difficult to quantify — such as citizens\' sense of control over their own lives, the depth of trust between individuals, and the institutional guarantees that every member of society, regardless of origin, has a fair opportunity to realize their potential — into our understanding of the concept of "development"?', category: 'kaoyan' },
  { id: 'k13', chinese: '如果说哥白尼的革命性贡献不仅仅在于他提出了一个在当时看来如此离经叛道的日心说模型——这个模型将人类赖以生存的地球从宇宙的中心位置无情地驱逐了出去，从而在神学、哲学和心理学层面同时对西方文明造成了前所未有的冲击——而更在于他开创了一种全新的知识生产方式，即理论的大胆假设必须接受系统化观察与数学计算的严格检验，而非诉诸于古老经典的权威或宗教教义的默示，那么正是这种后来被伽利略、开普勒和牛顿等巨人所继承和发扬的知识生产范式，在随后的四个世纪里不仅催生了现代科学技术的几乎所有分支，而且以一种潜移默化的方式深刻地重塑了人类对于自身在宇宙中的位置、知识的本质以及社会进步的动力来源的根本理解。', english: 'If Copernicus\'s revolutionary contribution lay not merely in his proposal of a heliocentric model that was so heretical in its time — a model that ruthlessly expelled the Earth, upon which humanity depended for its existence, from the center of the universe, thereby simultaneously dealing an unprecedented shock to Western civilization on theological, philosophical, and psychological levels — but more significantly in his inauguration of an entirely new mode of knowledge production, namely that bold theoretical hypotheses must be subjected to the rigorous scrutiny of systematic observation and mathematical calculation rather than appealing to the authority of ancient classics or the dictates of religious doctrine, then it was precisely this paradigm of knowledge production, later inherited and extended by giants such as Galileo, Kepler, and Newton, that in the four centuries that followed not only gave birth to virtually every branch of modern science and technology, but also, in a subtle and imperceptible manner, profoundly reshaped humanity\'s fundamental understanding of its own place in the cosmos, the nature of knowledge, and the sources of momentum behind social progress.', category: 'kaoyan' },
  { id: 'k14', chinese: '许多人在步入中年之后回望自己前半生所走过的道路时，往往会惊讶地发现一个耐人寻味的规律：那些被他们在年轻时刻意规划、精心设计、并投入了大量时间和精力去追求的宏大目标——比如进入某所名校的某个特定专业、在某家声名显赫的公司获得一个令人艳羡的职位、或者在某个年龄节点之前实现某个特定的财务指标——常常并未按照他们预期的方式实现，或者即便实现了也并未带来他们所期待的那种持久的满足感；相反，那些在事后被证明对他们整个生命轨迹产生了最为深远和持久影响的关键转折点，往往是一些在当时看来微不足道、甚至是纯属偶然的际遇——比如在一次百无聊赖的旅行途中与一个陌生人的一场看似随意的交谈、因为在截止日期的最后一刻改变主意而选修的一门与专业毫无关系的课程、或者因为一封本来不打算回复的邮件而建立起的一段跨越国界和文化的友谊。', english: 'When many people, upon entering middle age, look back at the path they have traversed in the first half of their lives, they often discover with surprise an intriguing pattern: those grand objectives that they deliberately planned, meticulously designed, and invested enormous amounts of time and energy in pursuing in their youth — such as gaining admission to a specific program at a prestigious university, securing an enviable position at a renowned company, or reaching a particular financial milestone before a certain age — frequently did not materialize in the way they had anticipated, or even if they did, failed to deliver the lasting sense of fulfillment they had expected; conversely, those pivotal turning points that in hindsight proved to have exerted the most profound and enduring influence on the entire trajectory of their lives were often encounters that appeared trivial or even purely accidental at the time — such as a seemingly casual conversation with a stranger during a boring trip, a course entirely unrelated to one\'s major that one enrolled in because of a last-moment change of mind at the deadline, or a friendship that transcended national borders and cultural divides, initiated by an email that one had originally not intended to reply to.', category: 'kaoyan' },
  { id: 'k15', chinese: '我们的时代正见证着一场前所未有的注意力争夺战，在这场战争中，每一家科技公司的商业模式——从社交媒体到短视频平台，从新闻聚合应用到移动游戏——都在本质上将人类大脑中历经数百万年进化而形成的多巴胺奖励回路作为可以被精确测量和刻意操控的靶标，以至于一个普通的现代人发现自己在一天之中能够不受任何外部干扰地沉浸于一项需要深度思考的任务之中的时间——那种被心理学家称为"心流"的、意识完全集中于当下活动而忘却自我与时间流逝的理想认知状态——已经萎缩到了令人难以置信的程度；而更为令人忧虑的是，绝大多数人甚至没有意识到自己的注意力正在被系统性剥夺，因为他们用来反思这一问题的注意力本身也已经被预先消耗殆尽。', english: 'Our era is witnessing an unprecedented war for attention, a war in which the business model of every technology company — from social media to short-video platforms, from news aggregation apps to mobile games — essentially treats the dopamine reward circuitry that the human brain evolved over millions of years as a target that can be precisely measured and deliberately manipulated, to the point where the amount of time that an ordinary modern individual finds themselves capable of immersing, without any external interruption, in a task requiring deep thought — that ideal cognitive state which psychologists call "flow," wherein consciousness is entirely absorbed in the present activity and the self and the passage of time are forgotten — has shrunk to an almost unbelievable degree; and what is even more troubling is that the vast majority of people do not even realize that their attention is being systematically stripped away from them, because the very attention they would need to reflect upon this problem has itself already been exhausted in advance.', category: 'kaoyan' },
  { id: 'k16', chinese: '如果说十九世纪的小说家们——无论是通过其笔下人物命运的跌宕起伏来全景式展现法国社会各阶层风貌的巴尔扎克，还是以惊人的心理深度探索罪与罚、信仰与怀疑之间微妙边界的陀思妥耶夫斯基，亦或是用细腻入微的笔触描绘英国乡村社会中那些表面平静却暗流涌动的人际关系的乔治·艾略特——之所以能够创造出那些历经一个多世纪仍然能够深深打动来自完全不同文化背景的读者的文学杰作，关键在于他们都拥有一种能够暂时悬置自身的价值判断、全神贯注地走进另一个人的内心世界并试图理解那些他们本人并不一定认同的情感和动机的能力，那么这种被文学批评家们称为"负能力"的品质——也即容忍不确定性、克制急于做出判断的冲动、并保持对复杂性和矛盾性的开放态度——不仅在文学创作中不可或缺，在任何需要跨越个体经验界限去理解他者的事业中，都具有同样的核心价值。', english: 'If the reason that the nineteenth-century novelists — whether it be Balzac, who through the vicissitudes of his characters\' fates painted a panoramic portrait of the various social strata of French society, or Dostoevsky, who explored with astonishing psychological depth the subtle boundaries between crime and punishment, faith and doubt, or George Eliot, who depicted with exquisitely nuanced brushstrokes those seemingly tranquil yet undercurrent-ridden human relationships in English rural society — were able to create literary masterpieces that, after more than a century, can still deeply move readers from entirely different cultural backgrounds, lies in the crucial fact that they all possessed an ability to temporarily suspend their own value judgments, to enter wholeheartedly into the inner world of another person, and to attempt to understand emotions and motivations that they themselves did not necessarily endorse, then this quality, which literary critics call "negative capability" — that is, the tolerance of uncertainty, the restraint of the impulse to rush to judgment, and the maintenance of openness toward complexity and contradiction — is not only indispensable in literary creation, but also holds equal core value in any endeavor that requires transcending the boundaries of individual experience to understand the other.', category: 'kaoyan' },
  { id: 'k17', chinese: '一项通过对跨越五大洲、涵盖三十二个国家、追踪时间长达两代人的超过五万个家庭的庞大数据集所进行的、其方法论之严谨和统计口径之全面在该领域研究中堪称前所未有的大规模跨国追踪研究表明，一个社会中代际流动性的高低——即一个人成年后的社会经济地位在多大程度上独立于其出生时所处的家庭背景——与该社会在公共教育、医疗保障和早期儿童发展等领域的公共投资力度之间存在着一种远比此前所认知的更为紧密和稳健的正向关联，而这种关联的强度甚至在控制了经济发展水平、政治制度类型和文化传统差异等可能混淆因果关系的变量之后依然保持在统计上高度显著的水平，这为一个长期以来在意识形态光谱两端之间争论不休的核心议题提供了来之不易的经验证据。', english: 'A large-scale cross-national longitudinal study, conducted on an enormous dataset spanning five continents, encompassing thirty-two countries, tracking more than fifty thousand families over a period of two generations, and characterized by a methodological rigor and comprehensiveness of statistical coverage that is arguably unprecedented in this field of research, demonstrates that the level of intergenerational mobility in a society — that is, the extent to which an individual\'s socioeconomic status in adulthood is independent of the family background into which they were born — exhibits a far closer and more robust positive correlation with the intensity of public investment in areas such as public education, healthcare, and early childhood development than was previously recognized, and that the strength of this correlation remains at a statistically highly significant level even after controlling for variables that could potentially confound the causal relationship, such as the level of economic development, the type of political system, and differences in cultural traditions, thereby providing hard-won empirical evidence on a core issue that has long been the subject of heated debate between the two ends of the ideological spectrum.', category: 'kaoyan' },
  { id: 'k18', chinese: '当一群在各自领域已经取得了足够显赫的成就、以至于完全可以在余生中仅仅依靠重复他们已经驾轻就熟的那套成功模式而过上安逸舒适的生活的人，却义无反顾地选择抛弃那些将他们送上了职业生涯巅峰的思维定势和行为惯性，甘愿冒着名誉受损和地位跌落的风险，像一个毫无经验的初学者一样踏入一个对于他们而言完全陌生的全新领域去从零开始学习那些最基础的概念和技能——每当这种现象出现在人类活动的任何一个领域，无论是科学、艺术、商业还是体育——它都不仅仅是在向旁观者展示一种令人钦佩的勇气，更是在以一种极具说服力的方式提醒我们：真正的创造力并非来自对已有知识体系的熟练掌握和高效运用，而是源于那种能够始终对未知保持开放、愿意在自己的无知面前保持谦卑、并敢于在不断推翻昨日之我的过程中寻求新生的精神姿态。', english: 'When a group of individuals who have already achieved sufficiently distinguished accomplishments in their respective fields — such that they could comfortably spend the rest of their lives merely repeating the set of successful formulas they have already mastered — nonetheless resolutely choose to abandon the mindsets and behavioral inertia that propelled them to the pinnacle of their careers, willingly risking damage to their reputation and a decline in their status, and venture like inexperienced beginners into entirely unfamiliar new domains to learn the most fundamental concepts and skills from scratch — whenever this phenomenon occurs in any sphere of human activity, be it science, art, business, or sports — it does not merely display an admirable courage to onlookers, but also reminds us, in a highly persuasive manner, that true creativity does not arise from the proficient mastery and efficient application of existing bodies of knowledge, but rather originates from a spiritual posture that can perpetually remain open to the unknown, maintain humility in the face of one\'s own ignorance, and dare to seek rebirth in the process of continually overthrowing the self of yesterday.', category: 'kaoyan' },
  { id: 'k19', chinese: '在长达数十年的时间里被西方政治学界奉为圭臬的"历史终结论"——即认为人类意识形态的演进已经在自由民主制度这一最终形态上达到了其逻辑终点，此后的世界政治将不再存在根本性的制度竞争——之所以在后来的历史进程中暴露出其致命的缺陷，并不在于它对自由主义民主制度本身所具有的某些优势的阐述缺乏说服力，而在于它的倡导者们在构建其宏大叙事时犯下了两个根本性的认知错误：其一，他们错误地将二十世纪下半叶西方世界所经历的那段特殊历史时期——一个建立在战后经济奇迹、冷战格局下的特殊地缘政治红利、以及布雷顿森林体系所提供的稳定国际货币环境等诸多不可复制的历史条件之上的繁荣阶段——当成了人类社会发展的普遍和必然方向；其二，也是更为关键的，他们严重低估了那些更深层次的人类需求——如对文化认同的渴望、对集体尊严的诉求、以及对一种超越物质利益的精神归属感的追寻——在特定条件下压倒纯粹经济理性考量的巨大能量。', english: 'The "end of history" thesis, which for decades was regarded as an article of faith in Western political science — namely the idea that the evolution of human ideology had reached its logical endpoint in the final form of liberal democracy, and that henceforth world politics would no longer feature fundamental institutional competition — proved in the subsequent course of history to contain a fatal flaw, not because its exposition of certain advantages of liberal democratic systems themselves lacked persuasiveness, but because its proponents committed two fundamental cognitive errors in constructing their grand narrative: first, they mistakenly took the particular historical period that the Western world experienced in the latter half of the twentieth century — a phase of prosperity built upon such irreproducible historical conditions as the post-war economic miracle, the special geopolitical dividends under the Cold War configuration, and the stable international monetary environment provided by the Bretton Woods system — as the universal and inevitable direction of human social development; second, and more critically, they severely underestimated the immense power of those deeper human needs — such as the longing for cultural identity, the demand for collective dignity, and the search for a sense of spiritual belonging that transcends material interests — to override purely economic rational calculations under specific conditions.', category: 'kaoyan' },
  { id: 'k20', chinese: '我们有理由相信，人类之所以能够在过去的几万年中从一个在食物链中并不占据显著优势的灵长类物种，逐步演变为一个能够部分地按照自己的意愿改造整个地球生态系统的"地质力量"——这一转变的关键节点包括了大约七万年前发生的、使得智人获得了使用复杂语言来建构和传播共同想象（如神话、宗教、国家和货币等"主体间现实"）能力的认知革命，大约一万两千年前开始的对多种动植物进行驯化的农业革命，以及五百年前发轫于西欧并在此后席卷全球的科学革命——并不是因为我们在生物学意义上比其他物种更加"高级"或更"适应"，而是因为我们是唯一一个能够在数以百万计的互不相识的个体之间建立起灵活而大规模的协作网络的物种，而这种协作能力的基础，恰恰在于我们的祖先在进化过程中偶然获得的那种能够相信并围绕那些并不存在于物理世界中的抽象概念——从部落图腾到股份有限公司——来组织集体行动的独特天赋。', english: 'We have reason to believe that the reason humanity has been able, over the past tens of thousands of years, to gradually transform from a primate species that did not occupy a conspicuous advantage in the food chain into a "geological force" capable of partially reshaping the entire Earth\'s ecosystem according to its own will — a transformation whose pivotal junctures include the Cognitive Revolution that occurred approximately seventy thousand years ago and endowed Homo sapiens with the capacity to use complex language to construct and disseminate shared fictions (such "intersubjective realities" as myths, religions, nations, and money), the Agricultural Revolution that began roughly twelve thousand years ago and involved the domestication of multiple plant and animal species, and the Scientific Revolution that originated in Western Europe five hundred years ago and has since swept across the entire globe — is not because we are biologically "more advanced" or "better adapted" than other species, but because we are the only species capable of establishing flexible and large-scale cooperative networks among millions of individuals who do not know one another, and the foundation of this capacity for cooperation lies precisely in that unique gift which our ancestors serendipitously acquired in the course of evolution: the ability to believe in and organize collective action around abstract concepts that do not exist in the physical world — from tribal totems to joint-stock corporations.', category: 'kaoyan' },
];

const CATEGORY_NAMES = { ielts: '雅思', cet: '四六级', kaoyan: '考研', daily: '日常会话', academic: '学术' };
const STORAGE_KEY_SENTENCES = 'translation_practice_sentences';
const STORAGE_KEY_STATS = 'translation_practice_stats';
const STORAGE_KEY_HISTORY = 'translation_practice_history';
const STORAGE_KEY_INDEX = 'translation_practice_index';

// ========== STATE ==========
let sentences = [];
let currentIndex = 0;
let filteredIndices = [];
let stats = { totalCompleted: 0, totalDuration: 0, streak: 0, lastPracticeDate: null, dailyCounts: {}, dailyDurations: {} };
let history = [];
let practiceStartTime = 0;
let direction = 'cn2en'; // 'cn2en' | 'en2cn'

// ========== INIT ==========
function init() {
  try {
  loadSentences();
  loadStats();
  loadHistory();
  updateFilteredIndices();
  updateStreak();
  loadCurrentIndex();
  renderPractice();
  renderStats();
  window.addEventListener('resize', autoFitStatsGrid);
  renderBank();
  renderWeeklyChart();
  renderHistory();
  } catch (e) {
    console.error('Init error:', e);
    // Reset corrupted data and retry
    localStorage.removeItem(STORAGE_KEY_SENTENCES);
    localStorage.removeItem(STORAGE_KEY_STATS);
    localStorage.removeItem(STORAGE_KEY_HISTORY);
    localStorage.removeItem(STORAGE_KEY_INDEX);
    sentences = JSON.parse(JSON.stringify(DEFAULT_SENTENCES));
    stats = defaultStats();
    history = [];
    saveSentences();
    saveStats();
    saveHistory();
    updateFilteredIndices();
    renderPractice();
    renderStats();
    renderBank();
    renderWeeklyChart();
    renderHistory();
  }

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      try {
        if (btn.dataset.tab === 'stats') { renderStats(); renderWeeklyChart(); renderHistory(); }
        if (btn.dataset.tab === 'bank') renderBank();
      } catch (e) { console.error('Tab render error:', e); }
    });
  });

  // Keyboard shortcut
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      submitTranslation();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowRight') {
      e.preventDefault();
      nextSentence();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowLeft') {
      e.preventDefault();
      prevSentence();
    }
  });

  // Category filter
  document.getElementById('categoryFilter').addEventListener('change', () => {
    updateFilteredIndices();
    currentIndex = 0;
    renderPractice();
  });

  document.getElementById('orderMode').addEventListener('change', () => {
    updateFilteredIndices();
    currentIndex = 0;
    renderPractice();
  });

  // Direction toggle
  document.querySelectorAll('.dir-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      direction = btn.dataset.dir;
      updateFilteredIndices();
      currentIndex = 0;
      renderPractice();
    });
  });
}

// ========== SENTENCE MANAGEMENT ==========
function loadSentences() {
  const stored = localStorage.getItem(STORAGE_KEY_SENTENCES);
  if (stored) {
    try { sentences = JSON.parse(stored); } catch (e) { sentences = []; }
  }
  if (!sentences || sentences.length === 0) {
    sentences = JSON.parse(JSON.stringify(DEFAULT_SENTENCES));
    saveSentences();
  }
}

function saveSentences() {
  localStorage.setItem(STORAGE_KEY_SENTENCES, JSON.stringify(sentences));
}

function getFilteredSentences() {
  const cat = document.getElementById('categoryFilter').value;
  if (cat === 'all') return [...sentences];
  return sentences.filter(s => s.category === cat);
}

function updateFilteredIndices() {
  const filtered = getFilteredSentences();
  filteredIndices = filtered.map(s => s.id);
  if (document.getElementById('orderMode').value === 'random') {
    shuffleArray(filteredIndices);
  }
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function getCurrentSentence() {
  if (filteredIndices.length === 0) return null;
  const id = filteredIndices[currentIndex % filteredIndices.length];
  return sentences.find(s => s.id === id);
}

function loadCurrentIndex() {
  const stored = localStorage.getItem(STORAGE_KEY_INDEX);
  if (stored !== null) currentIndex = parseInt(stored) || 0;
}

function saveCurrentIndex() {
  localStorage.setItem(STORAGE_KEY_INDEX, currentIndex.toString());
}

// ========== RENDER PRACTICE ==========
function renderPractice() {
  const sentence = getCurrentSentence();
  if (!sentence) {
    document.getElementById('sourceText').textContent = '题库为空，请先添加句子';
    document.getElementById('categoryTag').textContent = '';
    document.getElementById('sentenceIndex').textContent = '0 / 0';
    return;
  }
  const isCn2en = direction === 'cn2en';
  document.getElementById('sentenceLabel').innerHTML = isCn2en ? '&#x1F1E8;&#x1F1F3; 请将以下中文翻译成英文' : '&#x1F1EC;&#x1F1E7; 请将以下英文翻译成中文';
  document.getElementById('sourceText').textContent = isCn2en ? sentence.chinese : sentence.english;
  document.getElementById('categoryTag').textContent = CATEGORY_NAMES[sentence.category] || sentence.category;
  document.getElementById('sentenceIndex').textContent =
    `${(currentIndex % Math.max(1, filteredIndices.length)) + 1} / ${filteredIndices.length}`;
  document.getElementById('translationInput').placeholder = isCn2en ? '在这里输入你的英文翻译...' : '在这里输入你的中文翻译...';
  document.getElementById('comparison').classList.remove('show');
  document.getElementById('grammarPanel').classList.remove('show');
  document.getElementById('compScore').textContent = '';
  document.getElementById('translationInput').value = '';
  document.getElementById('translationInput').focus();
  practiceStartTime = Date.now();
  saveCurrentIndex();
}

function nextSentence() {
  if (filteredIndices.length === 0) return;
  currentIndex++;
  renderPractice();
}

function prevSentence() {
  if (filteredIndices.length === 0) return;
  currentIndex = Math.max(0, currentIndex - 1);
  renderPractice();
}

function showHint() {
  const sentence = getCurrentSentence();
  if (!sentence) return;
  const words = sentence.english.split(' ');
  const hintCount = Math.max(1, Math.floor(words.length * 0.3));
  const hintWords = [...words].sort(() => Math.random() - 0.5).slice(0, hintCount);
  document.getElementById('translationInput').value = '提示词汇: ' + hintWords.join(', ');
  showToast('已显示提示词汇');
}

function clearInput() {
  document.getElementById('translationInput').value = '';
}

// ========== SUBMIT & COMPARE ==========
function tokenize(text) {
  // Split into words and punctuation as separate tokens
  const tokens = [];
  const parts = text.split(/([.,!?;:'"()]|\s+)/g);
  for (const p of parts) {
    const trimmed = p.trim();
    if (trimmed.length === 0) continue;
    if (/^[.,!?;:'"()]$/.test(trimmed)) {
      tokens.push({ text: trimmed, type: 'punct' });
    } else {
      tokens.push({ text: trimmed, type: 'word' });
    }
  }
  return tokens;
}

function buildLCS(a, b) {
  // Returns LCS matrix between two sequences (comparing lowercase cleaned text)
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const aClean = a[i - 1].text.replace(/[.,!?;:'"]/g, '').toLowerCase();
      const bClean = b[j - 1].text.replace(/[.,!?;:'"]/g, '').toLowerCase();
      if (aClean === bClean) {
        dp[i][j] = dp[i - 1][j - 1] + 1;
      } else {
        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
  }
  return dp;
}

function alignSequences(userTokens, refTokens) {
  // Use LCS to align user tokens against reference tokens
  const dp = buildLCS(userTokens, refTokens);

  // Backtrack to find which user tokens match which ref tokens
  const userMatch = new Array(userTokens.length).fill(-1);
  const refMatch = new Array(refTokens.length).fill(-1);

  let i = userTokens.length, j = refTokens.length;
  while (i > 0 && j > 0) {
    const uClean = userTokens[i - 1].text.replace(/[.,!?;:'"]/g, '').toLowerCase();
    const rClean = refTokens[j - 1].text.replace(/[.,!?;:'"]/g, '').toLowerCase();
    if (uClean === rClean) {
      userMatch[i - 1] = j - 1;
      refMatch[j - 1] = i - 1;
      i--; j--;
    } else if (dp[i - 1][j] > dp[i][j - 1]) {
      i--;
    } else {
      j--;
    }
  }

  return { userMatch, refMatch };
}

function buildWordChips(tokens, matchTarget, type) {
  // type: 'your' or 'ref'
  return tokens.map((t, idx) => {
    if (t.type === 'punct') {
      return `<span class="word-chip chip-punct">${escapeHtml(t.text)}</span>`;
    }
    const matched = matchTarget[idx];
    if (type === 'your') {
      const cls = matched >= 0 ? 'chip-match' : 'chip-wrong';
      return `<span class="word-chip ${cls}">${escapeHtml(t.text)}</span>`;
    } else {
      const cls = matched >= 0 ? 'chip-match' : 'chip-miss';
      return `<span class="word-chip ${cls}">${escapeHtml(t.text)}</span>`;
    }
  }).join('');
}

function tokenizeCn(text) {
  // Tokenize Chinese text into characters, keeping punctuation separate
  const tokens = [];
  for (const ch of text) {
    if (/[，。！？；：""''（）\s]/.test(ch)) {
      tokens.push({ text: ch, type: 'punct' });
    } else {
      tokens.push({ text: ch, type: 'word' });
    }
  }
  return tokens;
}

function submitTranslation() {
  const sentence = getCurrentSentence();
  if (!sentence) return;
  const userInput = document.getElementById('translationInput').value.trim();
  if (!userInput) { showToast('请先输入你的翻译'); return; }

  const comparison = document.getElementById('comparison');
  comparison.classList.add('show');
  const isCn2en = direction === 'cn2en';

  const refText = isCn2en ? sentence.english : sentence.chinese;
  const userTokens = isCn2en ? tokenize(userInput) : tokenizeCn(userInput);
  const refTokens = isCn2en ? tokenize(refText) : tokenizeCn(refText);

  const { userMatch, refMatch } = alignSequences(userTokens, refTokens);

  document.getElementById('yourTranslation').innerHTML = buildWordChips(userTokens, userMatch, 'your');
  document.getElementById('refTranslation').innerHTML = buildWordChips(refTokens, refMatch, 'ref');
  document.getElementById('rowRefLabel').textContent = isCn2en ? '参考译文' : '参考译文';

  // Calculate score
  const refWordCount = refTokens.filter(t => t.type === 'word').length;
  const matchedRef = refMatch.filter(m => m >= 0).length;
  const score = refWordCount > 0 ? Math.round((matchedRef / refWordCount) * 100) : 0;
  const scoreEl = document.getElementById('compScore');
  let cls, emoji;
  if (score >= 80) { cls = 'high'; emoji = '\u{1F3AF}'; }
  else if (score >= 50) { cls = 'mid'; emoji = '\u{1F4AA}'; }
  else { cls = 'low'; emoji = '\u{1F50D}'; }
  scoreEl.className = 'comp-score ' + cls;
  scoreEl.innerHTML = `${emoji} ${score}%`;

  // Record practice with duration
  const duration = Math.round((Date.now() - practiceStartTime) / 1000);
  recordPractice(sentence, userInput, duration);

  // Grammar analysis (only for cn2en)
  if (isCn2en) {
    analyzeGrammar(userInput);
  } else {
    document.getElementById('grammarPanel').classList.remove('show');
  }

  // Scroll to comparison
  comparison.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ========== GRAMMAR ANALYSIS ==========
function analyzeGrammar(text) {
  const panel = document.getElementById('grammarPanel');
  const result = document.getElementById('grammarResult');
  panel.classList.add('show');

  const issues = [];

  // Normalize: strip leading/trailing whitespace, collapse spaces
  const trimmed = text.trim();

  // 1. Capitalization check
  if (trimmed.length > 0 && /[a-z]/.test(trimmed[0]) && trimmed[0] === trimmed[0].toLowerCase()) {
    issues.push({ type: 'error', msg: `句首应大写：<b>"${trimmed[0].toUpperCase()}${trimmed.slice(1, Math.min(20, trimmed.length))}..."</b>`, rule: '首字母大写' });
  }

  // 2. A vs An
  const aAnRe = /\ba\s+([aeiou]|hour|honest|heir|honor)/gi;
  let m;
  while ((m = aAnRe.exec(trimmed)) !== null) {
    issues.push({ type: 'error', msg: `<b>"a ${m[1]}"</b> 应改为 <b>"<span class="gfix">an ${m[1]}</span>"</b> — 元音音素前用 an`, rule: 'a / an' });
  }
  const anAR = /\ban\s+([bcdfghjklmnpqrstvwxyz])/gi;
  while ((m = anAR.exec(trimmed)) !== null) {
    if (/^[aeiou]/i.test(m[1])) continue;
    issues.push({ type: 'error', msg: `<b>"an ${m[1]}"</b> 应改为 <b>"<span class="gfix">a ${m[1]}</span>"</b> — 辅音音素前用 a`, rule: 'a / an' });
  }

  // 3. Common confusions
  const confusions = [
    { re: /\btheir\b/gi, check: 'there', fix: "they're / there / their", desc: "注意区分 their(他们的) / there(那里) / they're(他们是)" },
    { re: /\byour\b/gi, check: "you're", fix: "you're / your", desc: "注意区分 your(你的) / you're(你是)" },
    { re: /\bits\b/gi, check: "it's", fix: "it's / its", desc: "注意区分 its(它的) / it's(它是)" },
    { re: /\bto\s+(much|many|few|little|big|small|fast|slow|far|long|short|high|low|early|late|often|quick)/gi, fix: 'too + adj', desc: '"to" 可能应为 "too"（太……）' },
    { re: /\bwere\b/gi, check: "we're", fix: "we're / were", desc: "注意区分 were(是/was的过去式) / we're(我们是)" },
  ];

  // Simple check: flag common confusion words for review
  const lowerText = trimmed.toLowerCase();
  if (/\b(he|she|it)\s+(go|come|run|walk|talk|speak|eat|drink|sleep|work|play|like|love|hate|want|need|have|do|make|take|give|tell|say|know|think|feel|find|get)\b/i.test(trimmed)) {
    const svRe = /\b(he|she|it)\s+(go|come|run|walk|talk|speak|eat|drink|sleep|work|play|like|love|hate|want|need|have|do|make|take|give|tell|say|know|think|feel|find|get)\b/gi;
    while ((m = svRe.exec(trimmed)) !== null) {
      const verb = m[2].toLowerCase();
      const correct = verb === 'have' ? 'has' : verb === 'do' ? 'does' : verb === 'go' ? 'goes' : verb + 's';
      issues.push({ type: 'warn', msg: `<b>"${m[0]}"</b> — 第三人称单数可能需要加 -s/-es：<b>"<span class="gfix">${m[1]} ${correct}</span>"</b>`, rule: '主谓一致' });
    }
  }

  // 4. Double negatives
  if (/\b(not?|n't|never|no|nothing|nobody|nowhere)\b.*\b(not?|n't|never|no|nothing|nobody|nowhere)\b/i.test(trimmed)) {
    issues.push({ type: 'warn', msg: '检测到双重否定，英语中双重否定可能表达肯定含义，请检查是否意图表否定', rule: '双重否定' });
  }

  // 5. Missing verb (very basic check - if no common verb patterns found)
  const hasVerb = /\b(is|are|was|were|be|been|am|have|has|had|do|does|did|will|would|can|could|shall|should|may|might|must|go|come|get|make|take|give|see|know|think|say|tell|find|feel|want|need|like|love|work|play|run|walk|talk|speak|eat|drink|sleep|live|use|try|help|let|keep|put|set|show|mean|seem|become|leave|bring|call|ask|move|turn|start|stop|change|develop|increase|decrease|produce|provide|include|involve|believe|consider|expect|suggest|recommend|require|allow|enable|ensure|support|promote|improve|reduce|create|build|establish|maintain)\b/i.test(trimmed);
  if (!hasVerb && trimmed.split(/\s+/).length > 2) {
    issues.push({ type: 'info', msg: '未检测到常见动词，请检查句子是否缺少谓语动词', rule: '缺少动词' });
  }

  // 6. Count word differences vs reference as grammar hint
  const userWords = trimmed.split(/\s+/).filter(w => w.length > 0 && !/^[.,!?;:'"]$/.test(w));
  const refWords = getCurrentSentence()?.english.split(/\s+/).filter(w => w.length > 0 && !/^[.,!?;:'"]$/.test(w)) || [];
  if (userWords.length > 0 && refWords.length > 0) {
    const diff = userWords.length - refWords.length;
    if (Math.abs(diff) >= 5) {
      issues.push({ type: 'info', msg: `你的翻译有 ${userWords.length} 个词，参考译文有 ${refWords.length} 个词（差值 ${Math.abs(diff)}），请检查是否遗漏或多余了内容`, rule: '词数差异' });
    }
  }

  // 7. Repeated words
  const wordList = trimmed.toLowerCase().split(/\s+/);
  for (let i = 0; i < wordList.length - 1; i++) {
    if (wordList[i] === wordList[i + 1] && wordList[i].length > 1 && !/^[.,!?;:'"]$/.test(wordList[i])) {
      issues.push({ type: 'warn', msg: `检测到重复词：<b>"${escapeHtml(wordList[i])}"</b> 连续出现了两次`, rule: '重复词' });
    }
  }

  // 8. Spaces before punctuation
  if (/\s+[.,!?;:'"]/g.test(trimmed)) {
    issues.push({ type: 'info', msg: '标点符号前不应有空格（英文中逗号、句号等紧跟前一个词）', rule: '标点空格' });
  }

  // Render
  if (issues.length === 0) {
    result.innerHTML = '<div class="grammar-ok">&#x2705; 未检测到明显语法问题，翻译很棒！</div>';
  } else {
    const errors = issues.filter(i => i.type === 'error');
    const warns = issues.filter(i => i.type === 'warn');
    const infos = issues.filter(i => i.type === 'info');

    let html = '';
    if (errors.length > 0) {
      html += `<p style="font-size:12px;color:var(--error);font-weight:600;margin-bottom:6px;">&#x26A0;&#xFE0F; 错误 (${errors.length})</p>`;
      html += '<ul class="grammar-issues">' + errors.map(i => `<li class="issue-error"><span style="font-size:10px;color:var(--text-secondary);padding:1px 6px;border-radius:3px;flex-shrink:0;" class="grammar-badge">${escapeHtml(i.rule)}</span> ${i.msg}</li>`).join('') + '</ul>';
    }
    if (warns.length > 0) {
      html += `<p style="font-size:12px;color:var(--warning);font-weight:600;margin-bottom:6px;">&#x26A0;&#xFE0F; 警告 (${warns.length})</p>`;
      html += '<ul class="grammar-issues">' + warns.map(i => `<li class="issue-warn"><span style="font-size:10px;color:var(--text-secondary);padding:1px 6px;border-radius:3px;flex-shrink:0;" class="grammar-badge">${escapeHtml(i.rule)}</span> ${i.msg}</li>`).join('') + '</ul>';
    }
    if (infos.length > 0) {
      html += `<p style="font-size:12px;color:var(--primary);font-weight:600;margin-bottom:6px;">&#x2139;&#xFE0F; 建议 (${infos.length})</p>`;
      html += '<ul class="grammar-issues">' + infos.map(i => `<li class="issue-info"><span style="font-size:10px;color:var(--text-secondary);padding:1px 6px;border-radius:3px;flex-shrink:0;" class="grammar-badge">${escapeHtml(i.rule)}</span> ${i.msg}</li>`).join('') + '</ul>';
    }
    result.innerHTML = html;
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ========== STATS ==========
function loadStats() {
  const stored = localStorage.getItem(STORAGE_KEY_STATS);
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      stats = { ...defaultStats(), ...parsed };
      // Migrate old data: ensure dailyDurations exists
      if (!stats.dailyDurations) stats.dailyDurations = {};
      if (stats.totalDuration === undefined) stats.totalDuration = 0;
    } catch (e) { stats = defaultStats(); }
  } else {
    stats = defaultStats();
  }
}

function formatDuration(seconds) {
  if (seconds < 60) return seconds + '秒';
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return s > 0 ? m + '分' + s + '秒' : m + '分';
}

function defaultStats() {
  return { totalCompleted: 0, totalDuration: 0, streak: 0, lastPracticeDate: null, dailyCounts: {}, dailyDurations: {} };
}

function saveStats() {
  localStorage.setItem(STORAGE_KEY_STATS, JSON.stringify(stats));
}

function loadHistory() {
  const stored = localStorage.getItem(STORAGE_KEY_HISTORY);
  if (stored) {
    try { history = JSON.parse(stored); } catch (e) { history = []; }
  }
}

function saveHistory() {
  // Keep last 100 records
  history = history.slice(0, 100);
  localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
}

function recordPractice(sentence, userTranslation, duration) {
  const today = getDateString();
  stats.totalCompleted++;
  stats.totalDuration += (duration || 0);
  stats.dailyCounts[today] = (stats.dailyCounts[today] || 0) + 1;
  stats.dailyDurations[today] = (stats.dailyDurations[today] || 0) + (duration || 0);
  stats.lastPracticeDate = today;
  updateStreak();
  saveStats();

  history.unshift({
    date: today,
    chinese: sentence.chinese.substring(0, 30),
    userTranslation: userTranslation.substring(0, 50),
    category: sentence.category,
    duration: duration || 0
  });
  saveHistory();

  const elToday = document.getElementById('statToday');
  const elTotal = document.getElementById('statTotal');
  const elTodayDur = document.getElementById('statTodayDuration');
  if (elToday) elToday.textContent = stats.dailyCounts[today] || 0;
  if (elTotal) elTotal.textContent = stats.totalCompleted;
  if (elTodayDur) elTodayDur.textContent = formatDuration(stats.dailyDurations[today] || 0);
}

function updateStreak() {
  const today = getDateString();
  const yesterday = getDateString(-1);
  const lastDate = stats.lastPracticeDate;

  if (lastDate === today) {
    // Already practiced today, keep current streak
  } else if (lastDate === yesterday) {
    stats.streak++;
  } else if (lastDate && lastDate < yesterday) {
    stats.streak = 1;
  } else if (!lastDate) {
    stats.streak = 1;
  }
  saveStats();
  document.getElementById('streakBadge').innerHTML = `&#x1F525; 连续 ${stats.streak} 天`;
}

function getDateString(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().split('T')[0];
}

function renderStats() {
  const today = getDateString();
  const todayCount = stats.dailyCounts[today] || 0;
  const todayDur = stats.dailyDurations[today] || 0;
  document.getElementById('statToday').textContent = todayCount;
  document.getElementById('statTodayDuration').textContent = formatDuration(todayDur);
  document.getElementById('statTotal').textContent = stats.totalCompleted;
  document.getElementById('statAvgTime').textContent = stats.totalCompleted > 0 ? formatDuration(Math.round(stats.totalDuration / stats.totalCompleted)) : '0秒';
  document.getElementById('statStreak').textContent = stats.streak;

  const weekStart = new Date();
  weekStart.setDate(weekStart.getDate() - 6);
  let weekCount = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    weekCount += stats.dailyCounts[d.toISOString().split('T')[0]] || 0;
  }
  document.getElementById('statWeekly').textContent = weekCount;

  // Monthly count
  const now = new Date();
  let monthCount = 0;
  for (const [date, count] of Object.entries(stats.dailyCounts)) {
    if (date.startsWith(now.toISOString().slice(0, 7))) monthCount += count;
  }
  document.getElementById('statMonthly').textContent = monthCount;

  // Total duration
  document.getElementById('statTotalDuration').textContent = formatDuration(stats.totalDuration);

  // Practice days (unique days)
  document.getElementById('statPracticeDays').textContent = Object.keys(stats.dailyCounts).length;

  // Bank size
  document.getElementById('statBankSize').textContent = sentences.length;

  // Auto-fit grid columns
  autoFitStatsGrid();
}

function autoFitStatsGrid() {
  const grid = document.querySelector('.stats-grid');
  if (!grid) return;
  const cards = grid.children.length;
  if (cards === 0) return;
  const containerW = grid.parentElement.clientWidth;
  const gap = 14;
  const minCardW = 130;

  // How many columns fit at minimum width
  let maxCols = Math.floor((containerW + gap) / (minCardW + gap));
  maxCols = Math.max(2, Math.min(maxCols, cards));

  // Prefer column counts that leave no orphans (last row full or nearly full)
  let bestCols = maxCols;
  let bestRemainder = cards % maxCols;
  for (let n = maxCols; n >= 2; n--) {
    const rem = cards % n;
    // A row is "full" if remainder is 0; otherwise prefer smaller remainder
    if (rem === 0) { bestCols = n; break; }
    if (rem > bestRemainder) { bestCols = n; bestRemainder = rem; }
  }

  grid.style.gridTemplateColumns = `repeat(${bestCols}, 1fr)`;
}

function renderWeeklyChart() {
  const container = document.getElementById('weeklyChart');
  const days = [];
  const counts = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().split('T')[0];
    days.push(d.toLocaleDateString('zh-CN', { weekday: 'short' }));
    counts.push(stats.dailyCounts[dateStr] || 0);
  }
  const maxCount = Math.max(...counts, 1);

  container.innerHTML = days.map((day, i) => `
    <div class="chart-bar-wrap">
      <div class="chart-count">${counts[i]}</div>
      <div class="chart-bar" style="height:${(counts[i] / maxCount) * 100}%;background:${counts[i] > 0 ? 'var(--primary)' : 'var(--border)'};"></div>
      <div class="chart-label">${day}</div>
    </div>
  `).join('');
}

function renderHistory() {
  const container = document.getElementById('historyList');
  if (history.length === 0) {
    container.innerHTML = '<div class="empty-state">暂无记录，快去练习吧</div>';
    return;
  }
  container.innerHTML = history.slice(0, 20).map(h => `
    <div class="history-item">
      <div>
        <div style="font-weight:500">${escapeHtml(h.chinese)}...</div>
        <div style="color:var(--text-secondary);font-size:11px;">→ ${escapeHtml(h.userTranslation)}...</div>
      </div>
      <div style="text-align:right;">
        <div class="history-date">${h.date}</div>
        <div style="font-size:11px;color:var(--primary);">${h.duration > 0 ? formatDuration(h.duration) : ''}</div>
      </div>
    </div>
  `).join('');
}

function clearStats() {
  if (confirm('确定要清除所有统计数据吗？此操作不可恢复。')) {
    stats = defaultStats();
    history = [];
    saveStats();
    saveHistory();
    renderStats();
    renderWeeklyChart();
    renderHistory();
    document.getElementById('streakBadge').innerHTML = '&#x1F525; 连续 0 天';
    showToast('统计数据已清除');
  }
}

// ========== QUESTION BANK ==========
function renderBank() {
  const cat = document.getElementById('bankCategoryFilter').value;
  const filtered = cat === 'all' ? sentences : sentences.filter(s => s.category === cat);
  const tbody = document.getElementById('sentenceTableBody');

  tbody.innerHTML = filtered.map(s => `
    <tr>
      <td class="col-cat"><span class="cat-badge">${CATEGORY_NAMES[s.category] || s.category}</span></td>
      <td class="col-cn"><div class="td-wrap" title="${escapeHtml(s.chinese)}">${escapeHtml(s.chinese)}</div></td>
      <td class="col-en"><div class="td-wrap" title="${escapeHtml(s.english)}">${escapeHtml(s.english)}</div></td>
      <td class="col-act actions">
        <button class="btn btn-ghost" onclick="editSentence('${s.id}')" title="编辑">&#x270F;&#xFE0F;</button>
        <button class="btn btn-ghost" onclick="deleteSentence('${s.id}')" title="删除" style="color:var(--error);">&#x1F5D1;</button>
      </td>
    </tr>
  `).join('');

  document.getElementById('bankCount').textContent = filtered.length;
}

function toggleAddForm() {
  const form = document.getElementById('addForm');
  form.classList.toggle('show');
  if (form.classList.contains('show')) {
    document.getElementById('newChinese').value = '';
    document.getElementById('newEnglish').value = '';
    document.getElementById('newChinese').focus();
  }
  // Clear edit mode
  delete form.dataset.editId;
}

function addSentence() {
  const form = document.getElementById('addForm');
  const chinese = document.getElementById('newChinese').value.trim();
  const english = document.getElementById('newEnglish').value.trim();
  const category = document.getElementById('newCategory').value;

  if (!chinese || !english) { showToast('请填写中文句子和英文翻译'); return; }

  const editId = form.dataset.editId;
  if (editId) {
    const idx = sentences.findIndex(s => s.id === editId);
    if (idx >= 0) {
      sentences[idx].chinese = chinese;
      sentences[idx].english = english;
      sentences[idx].category = category;
    }
    delete form.dataset.editId;
  } else {
    const id = 's' + Date.now();
    sentences.push({ id, chinese, english, category });
  }

  saveSentences();
  updateFilteredIndices();
  renderBank();
  renderPractice();
  toggleAddForm();
  showToast(editId ? '句子已更新' : '句子已添加');
}

function editSentence(id) {
  const sentence = sentences.find(s => s.id === id);
  if (!sentence) return;

  const form = document.getElementById('addForm');
  form.classList.add('show');
  form.dataset.editId = id;
  document.getElementById('newChinese').value = sentence.chinese;
  document.getElementById('newEnglish').value = sentence.english;
  document.getElementById('newCategory').value = sentence.category;
  form.scrollIntoView({ behavior: 'smooth' });
}

function deleteSentence(id) {
  if (!confirm('确定要删除这个句子吗？')) return;
  sentences = sentences.filter(s => s.id !== id);
  saveSentences();
  updateFilteredIndices();
  renderBank();
  renderPractice();
  showToast('句子已删除');
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error('格式错误');
        const valid = data.filter(item => item.chinese && item.english);
        if (valid.length === 0) { showToast('未找到有效句子，请检查 JSON 格式'); return; }
        valid.forEach(item => {
          if (!item.id) item.id = 's' + Date.now() + Math.random().toString(36).substr(2, 5);
          if (!item.category) item.category = 'ielts';
        });
        sentences = [...sentences, ...valid];
        saveSentences();
        updateFilteredIndices();
        renderBank();
        renderPractice();
        showToast(`成功导入 ${valid.length} 个句子`);
      } catch (err) {
        showToast('JSON 解析失败: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(sentences, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'translation-sentences-' + getDateString() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('题库已导出');
}

function resetToDefault() {
  if (!confirm('确定要恢复为默认题库吗？你自定义的句子将会丢失。')) return;
  sentences = JSON.parse(JSON.stringify(DEFAULT_SENTENCES));
  saveSentences();
  updateFilteredIndices();
  currentIndex = 0;
  renderBank();
  renderPractice();
  showToast('已恢复默认题库（' + sentences.length + ' 句）');
}

// ========== TOAST ==========
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ========== THEME ==========
function getTheme() {
  const stored = localStorage.getItem('translation_practice_theme');
  if (stored) return stored;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').innerHTML = theme === 'dark' ? '&#x1F31E;' : '&#x1F31E;';
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '\u{1F319}' : '\u{1F31E}';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('translation_practice_theme', next);
  applyTheme(next);
}

// ========== START ==========
applyTheme(getTheme());
init();
</script>
